<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Bot Pro - V3</title>
    <style>
        :root { --discord-blue: #5865F2; --discord-dark: #313338; --bg-dark: #1e1f22; --bg-card: #2b2d31; --text-main: #f2f3f5; --success: #23a559; --danger: #da373c; --warning: #f0b232;}
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .dashboard { width: 100%; max-width: 1100px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .card { background-color: var(--bg-card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); animation: fadeIn 0.4s ease-out backwards; margin-bottom: 20px;}
        .card:nth-child(1) { animation-delay: 0.1s; } .card:nth-child(2) { animation-delay: 0.2s; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        
        h2 { font-size: 18px; border-bottom: 2px solid var(--discord-dark); padding-bottom: 10px; margin-top: 0; display: flex; align-items: center; gap: 10px;}
        
        .btn { background-color: var(--discord-blue); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; transition: 0.2s; text-align: center; width: 100%; box-sizing: border-box; margin-bottom: 10px;}
        .btn:hover { filter: brightness(1.2); transform: scale(1.02); }
        .btn:active { transform: scale(0.98); }
        .btn.danger { background-color: var(--danger); } .btn.success { background-color: var(--success); } .btn.warning { background-color: var(--warning); color: #000;}
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px;}
        .btn-group .btn { margin-bottom: 0; }

        input, select { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #1e1f22; color: white; margin-bottom: 15px; outline: none; box-sizing: border-box;}
        input[type="file"] { padding: 10px; border: 1px dashed var(--discord-blue); cursor: pointer; }
        
        .volume-container { display: flex; align-items: center; gap: 10px; background: #1e1f22; padding: 10px; border-radius: 6px; margin-bottom: 15px;}
        input[type="range"] { width: 100%; cursor: pointer; margin: 0; }
        
        /* Contrôles du Media Player */
        .player-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; background: #111214; padding: 15px; border-radius: 8px; margin-top: 10px; border: 1px solid #3f4147;}
        .player-controls .btn { padding: 15px 5px; font-size: 14px; }
        .play-btn { grid-column: span 3; font-size: 18px !important; padding: 20px !important; }
        
        #notification { position: fixed; bottom: 20px; right: 20px; background: var(--success); padding: 15px 25px; border-radius: 8px; display: none; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-weight: bold;}
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <h1>✨ Centre de Contrôle Avancé V3</h1>
            <span style="background: #111214; padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 14px;">🟢 Bot en ligne</span>
        </div>

        <div class="grid">
            <!-- COLONNE GAUCHE -->
            <div>
                <!-- CONNEXION VOCALE -->
                <div class="card">
                    <h2>🎧 Statut Vocal</h2>
                    <div class="btn-group">
                        <button class="btn success" onclick="action('/api/voice/join')">Entrer (Join)</button>
                        <button class="btn danger" onclick="action('/api/voice/leave')">Sortir (Leave)</button>
                    </div>
                    <div class="btn-group">
                        <button class="btn warning" onclick="action('/api/voice/mute')">Rendre Muet 🤫</button>
                        <button class="btn success" onclick="action('/api/voice/unmute')">Démuter 🎤</button>
                    </div>
                </div>

                <!-- SYSTÈME & AUTOMATISATION -->
                <div class="card">
                    <h2>⚙️ Système Chat</h2>
                    <p style="font-size: 13px; color: #b5bac1;">Le bot détecte tes mots clés (ex: "salut", "ping", "bot") et répond tout seul.</p>
                    <button class="btn" style="background-color: #636b75;" onclick="action('/api/auto/toggle')">🔁 Activer / Désactiver les Auto-Réponses</button>
                </div>
            </div>

            <!-- COLONNE DROITE : LE MEDIA PLAYER -->
            <div>
                <div class="card">
                    <h2>🎛️ Media Player Ultime</h2>
                    
                    <form id="uploadForm" onsubmit="uploadSound(event)">
                        <label style="font-size: 13px; font-weight: bold; color: var(--discord-blue);">1. Ajouter un nouveau son</label>
                        <div class="btn-group" style="margin-top: 5px;">
                            <input type="file" id="soundFile" accept="audio/mp3, audio/wav, audio/ogg" required>
                            <button type="submit" class="btn" style="width: auto; padding: 0 20px;">📤 Upload</button>
                        </div>
                    </form>
                    
                    <hr style="border-color: #3f4147; margin: 15px 0;">
                    
                    <label style="font-size: 13px; font-weight: bold; color: var(--discord-blue);">2. Choisir la piste</label>
                    <select id="soundList"><option value="">Chargement de ta bibliothèque...</option></select>
                    
                    <div class="volume-container">
                        <span>🔈 Vol:</span>
                        <input type="range" id="volumeSlider" min="0" max="100" value="50">
                        <span id="volumeValue" style="min-width: 40px; text-align: right; font-weight: bold;">50%</span>
                    </div>

                    <div class="player-controls">
                        <button class="btn success play-btn" onclick="playSound()">▶️ JOUER LA PISTE</button>
                        <button class="btn warning" onclick="action('/api/sound/pause')">⏸️ Pause</button>
                        <button class="btn" style="background: var(--discord-blue);" onclick="action('/api/sound/resume')">⏯️ Reprendre</button>
                        <button class="btn danger" onclick="action('/api/sound/stop')">⏹️ Stop</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="notification">✅ Action réussie !</div>

    <script>
        document.getElementById('volumeSlider').addEventListener('input', (e) => {
            document.getElementById('volumeValue').innerText = e.target.value + '%';
        });

        async function action(endpoint) {
            try {
                let res = await fetch(endpoint);
                let data = await res.json();
                showNotification(data.message);
            } catch (e) { showNotification("Erreur serveur ❌"); }
        }

        async function uploadSound(event) {
            event.preventDefault();
            const fileInput = document.getElementById('soundFile');
            if(!fileInput.files.length) return;
            
            const formData = new FormData();
            formData.append('soundFile', fileInput.files[0]);

            let res = await fetch('/api/upload-sound', { method: 'POST', body: formData });
            let data = await res.json();
            showNotification(data.message);
            fileInput.value = ""; // Vide la case après upload
            loadSounds(); 
        }

        async function loadSounds() {
            let res = await fetch('/api/sounds');
            let sounds = await res.json();
            let select = document.getElementById('soundList');
            select.innerHTML = sounds.length ? '' : '<option value="">Aucun fichier audio trouvé</option>';
            sounds.forEach(s => select.innerHTML += `<option value="${s}">${s}</option>`);
        }

        async function playSound() {
            const soundName = document.getElementById('soundList').value;
            const volume = document.getElementById('volumeSlider').value;
            if(!soundName) return showNotification("Choisis une piste d'abord ! ❌");

            let res = await fetch('/api/play-sound', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ soundName, volume })
            });
            let data = await res.json();
            showNotification(data.message);
        }

        function showNotification(msg) {
            const notif = document.getElementById('notification');
            notif.innerText = msg;
            notif.style.display = 'block';
            setTimeout(() => notif.style.display = 'none', 3000);
        }

        // On charge la bibliothèque au démarrage
        loadSounds();
    </script>
</body>
</html>
